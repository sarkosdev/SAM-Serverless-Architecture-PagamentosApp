          : [\n          [ \"AWS/DynamoDB\", \"ConsumedReadCapacityUnits\", \"TableName\"\
          , \"${PagamentosTable}\", { \"stat\": \"Sum\", \"label\": \"Read capacity\"\
          \ } ],\n          [ \".\", \"ConsumedWriteCapacityUnits\", \".\", \".\"\
          , { \"stat\": \"Sum\", \"label\": \"Write capacity\" } ],\n          [ \"\
          .\", \"ThrottledRequests\", \".\", \".\", { \"stat\": \"Sum\", \"label\"\
          : \"Throttled requests\" } ]\n        ],\n        \"view\": \"timeSeries\"\
          ,\n        \"stacked\": false,\n        \"region\": \"${AWS::Region}\",\n\
