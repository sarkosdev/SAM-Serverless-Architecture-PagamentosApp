  PagamentosAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${AWS::StackName}-alarms
      Subscription:
      - Protocol: email
        Endpoint:
          Ref: AlarmNotificationEmail
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-api-gateway-5xx
      AlarmDescription: API Gateway returned 5XX errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
      - Name: ApiId
        Value:
          Ref: PagamentosHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: PagamentosAlarmTopic
  ApiGatewayHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-api-gateway-high-latency
      AlarmDescription: API Gateway average latency is high
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
      - Name: ApiId
        Value:
          Ref: PagamentosHttpApi
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: PagamentosAlarmTopic
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-lambda-throttles
      AlarmDescription: One or more Lambda functions were throttled
      Metrics:
      - Id: readThrottles
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Throttles
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: ReadPagamentosFunction
          Period: 300
          Stat: Sum
        ReturnData: false
      - Id: createThrottles
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Throttles
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: CreatePagamentoFunction
          Period: 300
          Stat: Sum
        ReturnData: false
      - Id: pagarThrottles
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Throttles
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: PagarPagamentosFunction
          Period: 300
          Stat: Sum
        ReturnData: false
      - Id: deleteThrottles
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Throttles
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: DeletePagamentoFunction
          Period: 300
          Stat: Sum
        ReturnData: false
      - Id: historicoThrottles
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Throttles
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: HistoricoFunction
          Period: 300
          Stat: Sum
        ReturnData: false
      - Id: downloadPdfThrottles
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Throttles
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: DownloadPdfFunction
          Period: 300
          Stat: Sum
        ReturnData: false
      - Id: totalThrottles
        Expression: readThrottles + createThrottles + pagarThrottles + deleteThrottles
          + historicoThrottles + historicoThrottles
        Label: Total Lambda throttles
        ReturnData: true
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: PagamentosAlarmTopic
  DynamoDbThrottledRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-dynamodb-throttled-requests
      AlarmDescription: DynamoDB table has throttled requests
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
      - Name: TableName
        Value:
          Ref: PagamentosTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: PagamentosAlarmTopic
  PagamentosRegistoPdfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-pagamento-registo-pdf
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
Outputs:
  PagamentosApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${PagamentosHttpApi}.execute-api.${AWS::Region}.amazonaws.com/pagamentos
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: PagamentosUserPool
  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value:
      Ref: PagamentosUserPoolClient
  CognitoHostedUiDomain:
    Description: Cognito Hosted UI Domain
    Value:
      Fn::Sub: https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  CognitoRegion:
    Description: AWS Region for Cognito
    Value:
      Ref: AWS::Region
  CloudWatchDashboardName:
    Description: CloudWatch Dashboard name
    Value:
      Ref: PagamentosCloudWatchDashboard
  AlarmTopicArn:
    Description: SNS Topic ARN for CloudWatch alarms
    Value:
      Ref: PagamentosAlarmTopic
