AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Pagamentos API with API Gateway, Lambda and DynamoDB
Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:4200
    Description: Frontend origin allowed to call the API through CORS
  CognitoDomainPrefix:
    Type: String
    Default: pagamentos-app-authenticator
    Description: Prefix for the Cognito Hosted UI domain
  FrontendUrl:
    Type: String
    Default: https://main.d3at3wpexagb3r.amplifyapp.com
    Description: Angular application URL
  AlarmNotificationEmail:
    Type: String
    Description: Email address that receives CloudWatch alarm notifications
Globals:
  Function:
    Runtime: java25
    Timeout: 10
    MemorySize: 1024
    Architectures:
    - arm64
    Tracing: Active
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ''
        S3_ENDPOINT: ''
        APP_ENV: cloud
        LOCAL_USERNAME: ''
Resources:
  PagamentosHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      AccessLogSettings:
        DestinationArn:
          Fn::GetAtt:
          - PagamentosApiAccessLogs
          - Arn
        Format: '{"requestId": "$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error","authorizerPrincipalId":"$context.authorizer.principalId","jwtSubject":"$context.authorizer.claims.sub","requestTimeEpoch":"$context.requestTimeEpoch","responseLatency":"$context.responseLatency","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","jwtUsername":"$context.authorizer.claims.username","userAgent":"$context.identity.userAgent"}'
      DefinitionBody:
        openapi: 3.0.1
        info:
          title:
            Fn::Sub: ${AWS::StackName}-pagamentos-api
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowOrigins:
        - Ref: AllowedOrigin
        - http://127.0.0.1:4200
        - http://localhost:4200
        AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        AllowCredentials: false
        MaxAge: 300
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${PagamentosUserPool}
              audience:
              - Ref: PagamentosUserPoolClient
            IdentitySource: $request.header.Authorization
  PagamentosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-pagamentos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
  PagamentosUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: ${AWS::StackName}-user-pool
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
  PagamentosUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: pagamentos-app-client
      UserPoolId:
        Ref: PagamentosUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
      - code
      AllowedOAuthScopes:
      - openid
      - email
      - profile
      CallbackURLs:
      - Ref: FrontendUrl
      - http://localhost:4200
      LogoutURLs:
      - Ref: FrontendUrl
      - http://localhost:4200
      SupportedIdentityProviders:
      - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10
  PagamentosUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Ref: CognitoDomainPrefix
      UserPoolId:
        Ref: PagamentosUserPool
      ManagedLoginVersion: 2
  PagamentosManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId:
        Ref: PagamentosUserPool
      ClientId:
        Ref: PagamentosUserPoolClient
      UseCognitoProvidedValues: true
  PdfBoxLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${AWS::StackName}-pdfbox
      Description: PDFBox dependencies used to generate payment PDFs
      ContentUri: ..\..\PdfBoxLayer\target\layer
      CompatibleRuntimes:
      - java25
      CompatibleArchitectures:
      - arm64
      RetentionPolicy: Delete
  ReadPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ReadPagamentosFunction
      Handler: pagamentos.handler.ReadPagamentosHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME:
            Ref: PagamentosTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: PagamentosTable
      Events:
        ListPagamentos:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos
            Method: GET
        GetPagamento:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: GET
        ListPagamentosByStatus:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos/status/{status}
            Method: GET
      LoggingConfig:
        LogGroup:
          Ref: PagamentosLambdaLogs
        LogFormat: Text
    Metadata:
      SamResourceId: ReadPagamentosFunction
  CreatePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreatePagamentoFunction
      Handler: pagamentos.handler.CreatePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME:
            Ref: PagamentosTable
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: PagamentosTable
      Events:
        CreatePagamento:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos
            Method: POST
      LoggingConfig:
        LogGroup:
          Ref: PagamentosLambdaLogs
        LogFormat: Text
    Metadata:
      SamResourceId: CreatePagamentoFunction
  PagarPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagarPagamentosFunction
      Handler: pagamentos.handler.PagarPagamentoHandler::handleRequest
      Layers:
      - Ref: PdfBoxLayer
      Environment:
        Variables:
          TABLE_NAME:
            Ref: PagamentosTable
          BUCKET_NAME:
            Ref: PagamentosRegistoPdfBucket
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PagamentosTable
      - S3WritePolicy:
          BucketName:
            Ref: PagamentosRegistoPdfBucket
      Events:
        PagarPagamentos:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos/pagar
            Method: POST
      LoggingConfig:
        LogGroup:
          Ref: PagamentosLambdaLogs
        LogFormat: Text
    Metadata:
      SamResourceId: PagarPagamentosFunction
  DeletePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DeletePagamentoFunction
      Handler: pagamentos.handler.DeletePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME:
            Ref: PagamentosTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PagamentosTable
      Events:
        DeletePagamentoById:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: DELETE
        DeletePagamentoByProcessNum:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos/process/{processNum}
            Method: DELETE
      LoggingConfig:
        LogGroup:
          Ref: PagamentosLambdaLogs
        LogFormat: Text
    Metadata:
      SamResourceId: DeletePagamentoFunction
  HistoricoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HistoricoFunction
      Handler: historico.handler.HistoricoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME:
            Ref: PagamentosTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: PagamentosTable
      Events:
        ListHistoricoByUser:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /historico
            Method: GET
      LoggingConfig:
        LogGroup:
          Ref: PagamentosLambdaLogs
        LogFormat: Text
    Metadata:
      SamResourceId: HistoricoFunction
  DownloadPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DownloadPdfFunction
      Handler: pagamentos.handler.DownloadPdfHandler::handleRequest
      Environment:
        Variables:
          BUCKET_NAME:
            Ref: PagamentosRegistoPdfBucket
      Policies:
      - S3ReadPolicy:
          BucketName:
            Ref: PagamentosRegistoPdfBucket
      Events:
        DownloadPdf:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: PagamentosHttpApi
            Path: /pagamentos/comprovativo/pdf
            Method: GET
      LoggingConfig:
        LogGroup:
          Ref: PagamentosLambdaLogs
        LogFormat: Text
    Metadata:
      SamResourceId: DownloadPdfFunction
  PagamentosApiAccessLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName:
        Fn::Sub: /aws/apigateway/${AWS::StackName}-pagamentos-http-api-access
      RetentionInDays: 30
  PagamentosLambdaLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName:
        Fn::Sub: /pagamentos/${AWS::StackName}/lambda
      RetentionInDays: 30
  PagamentosCloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: ${AWS::StackName}-dashboard
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"text\",\n      \"\
          x\": 0,\n      \"y\": 0,\n      \"width\": 24,\n      \"height\": 2,\n \
          \     \"properties\": {\n        \"markdown\": \"# Serverless Pagamentos\
          \ App\\\\nAPI Gateway, Lambda and DynamoDB operational dashboard\"\n   \
          \   }\n    },\n    {\n      \"type\": \"metric\",\n      \"x\": 0,\n   \
          \   \"y\": 2,\n      \"width\": 12,\n      \"height\": 6,\n      \"properties\"\
          : {\n        \"metrics\": [\n          [ \"AWS/ApiGateway\", \"Count\",\
          \ \"ApiId\", \"${PagamentosHttpApi}\", { \"stat\": \"Sum\", \"label\": \"\
          Requests\" } ],\n          [ \".\", \"4xx\", \".\", \".\", { \"stat\": \"\
          Sum\", \"label\": \"4XX errors\" } ],\n          [ \".\", \"5xx\", \".\"\
          , \".\", { \"stat\": \"Sum\", \"label\": \"5XX errors\" } ]\n        ],\n\
          \        \"view\": \"timeSeries\",\n        \"stacked\": false,\n      \
          \  \"region\": \"${AWS::Region}\",\n        \"title\": \"API Gateway requests\
          \ and errors\",\n        \"period\": 300\n      }\n    },\n    {\n     \
          \ \"type\": \"metric\",\n      \"x\": 12,\n      \"y\": 2,\n      \"width\"\
          : 12,\n      \"height\": 6,\n      \"properties\": {\n        \"metrics\"\
          : [\n          [ \"AWS/ApiGateway\", \"Latency\", \"ApiId\", \"${PagamentosHttpApi}\"\
          , { \"stat\": \"Average\", \"label\": \"Average latency\" } ],\n       \
          \   [ \".\", \".\", \".\", \".\", { \"stat\": \"p95\", \"label\": \"p95\
          \ latency\" } ]\n        ],\n        \"view\": \"timeSeries\",\n       \
          \ \"stacked\": false,\n        \"region\": \"${AWS::Region}\",\n       \
          \ \"title\": \"API Gateway latency\",\n        \"period\": 300\n      }\n\
          \    },\n    {\n      \"type\": \"metric\",\n      \"x\": 0,\n      \"y\"\
          : 8,\n      \"width\": 12,\n      \"height\": 6,\n      \"properties\":\
          \ {\n        \"metrics\": [\n          [ \"AWS/Lambda\", \"Invocations\"\
          , \"FunctionName\", \"${ReadPagamentosFunction}\", { \"stat\": \"Sum\",\
          \ \"label\": \"Read\" } ],\n          [ \".\", \".\", \".\", \"${CreatePagamentoFunction}\"\
          , { \"stat\": \"Sum\", \"label\": \"Create\" } ],\n          [ \".\", \"\
          .\", \".\", \"${PagarPagamentosFunction}\", { \"stat\": \"Sum\", \"label\"\
          : \"Pagar\" } ],\n          [ \".\", \".\", \".\", \"${DeletePagamentoFunction}\"\
          , { \"stat\": \"Sum\", \"label\": \"Delete\" } ],\n          [ \".\", \"\
          .\", \".\", \"${HistoricoFunction}\",  {\"stat\": \"Sum\", \"label\": \"\
          Historico\" } ],\n          [ \".\", \".\", \".\", \"${DownloadPdfFunction}\"\
          , {\"stat\": \"Sum\", \"label\": \"Download PDF\" } ]\n        ],\n    \
          \    \"view\": \"timeSeries\",\n        \"stacked\": false,\n        \"\
          region\": \"${AWS::Region}\",\n        \"title\": \"Lambda invocations\"\
          ,\n        \"period\": 300\n      }\n    },\n    {\n      \"type\": \"metric\"\
          ,\n      \"x\": 12,\n      \"y\": 8,\n      \"width\": 12,\n      \"height\"\
          : 6,\n      \"properties\": {\n        \"metrics\": [\n          [ \"AWS/Lambda\"\
          , \"Errors\", \"FunctionName\", \"${ReadPagamentosFunction}\", { \"stat\"\
          : \"Sum\", \"label\": \"Read errors\" } ],\n          [ \".\", \".\", \"\
          .\", \"${CreatePagamentoFunction}\", { \"stat\": \"Sum\", \"label\": \"\
          Create errors\" } ],\n          [ \".\", \".\", \".\", \"${PagarPagamentosFunction}\"\
          , { \"stat\": \"Sum\", \"label\": \"Pagar errors\" } ],\n          [ \"\
          .\", \".\", \".\", \"${DeletePagamentoFunction}\", { \"stat\": \"Sum\",\
          \ \"label\": \"Delete errors\" } ],\n          [ \".\", \".\", \".\", \"\
          ${HistoricoFunction}\",  {\"stat\": \"Sum\", \"label\": \"Historico errors\"\
          \ } ],\n          [ \".\", \".\", \".\", \"${DownloadPdfFunction}\", {\"\
          stat\": \"Sum\", \"label\": \"Download PDF errors\" } ],\n\n          [\
          \ \".\", \"Throttles\", \".\", \"${ReadPagamentosFunction}\", { \"stat\"\
          : \"Sum\", \"label\": \"Read throttles\" } ],\n          [ \".\", \".\"\
          , \".\", \"${CreatePagamentoFunction}\", { \"stat\": \"Sum\", \"label\"\
          : \"Create throttles\" } ],\n          [ \".\", \".\", \".\", \"${PagarPagamentosFunction}\"\
          , { \"stat\": \"Sum\", \"label\": \"Pagar throttles\" } ],\n          [\
          \ \".\", \".\", \".\", \"${DeletePagamentoFunction}\", { \"stat\": \"Sum\"\
          , \"label\": \"Delete throttles\" } ],\n          [ \".\", \".\", \".\"\
          , \"${HistoricoFunction}\",  {\"stat\": \"Sum\", \"label\": \"Historico\
          \ throttles\" } ],\n          [ \".\", \".\", \".\", \"${DownloadPdfFunction}\"\
          ,{\"stat\": \"Sum\", \"label\": \"Download PDF throttles\" } ]\n       \
          \ ],\n        \"view\": \"timeSeries\",\n        \"stacked\": false,\n \
          \       \"region\": \"${AWS::Region}\",\n        \"title\": \"Lambda errors\
          \ and throttles\",\n        \"period\": 300\n      }\n    },\n    {\n  \
          \    \"type\": \"metric\",\n      \"x\": 0,\n      \"y\": 14,\n      \"\
          width\": 12,\n      \"height\": 6,\n      \"properties\": {\n        \"\
          metrics\": [\n          [ \"AWS/Lambda\", \"Duration\", \"FunctionName\"\
          , \"${ReadPagamentosFunction}\", { \"stat\": \"Average\", \"label\": \"\
          Read avg\" } ],\n          [ \".\", \".\", \".\", \"${CreatePagamentoFunction}\"\
          , { \"stat\": \"Average\", \"label\": \"Create avg\" } ],\n          [ \"\
          .\", \".\", \".\", \"${PagarPagamentosFunction}\", { \"stat\": \"Average\"\
          , \"label\": \"Pagar avg\" } ],\n          [ \".\", \".\", \".\", \"${DeletePagamentoFunction}\"\
          , { \"stat\": \"Average\", \"label\": \"Delete avg\" } ],\n          [ \"\
          .\", \".\", \".\", \"${HistoricoFunction}\",  {\"stat\": \"Average\", \"\
          label\": \"Historico avg\" } ],\n          [ \".\", \".\", \".\", \"${DownloadPdfFunction}\"\
          , {\"stat\": \"Average\", \"label\": \"Download PDF avg\" } ]\n        ],\n\
          \        \"view\": \"timeSeries\",\n        \"stacked\": false,\n      \
          \  \"region\": \"${AWS::Region}\",\n        \"title\": \"Lambda average\
