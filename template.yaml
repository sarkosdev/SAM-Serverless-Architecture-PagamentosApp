AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Pagamentos API with API Gateway, Lambda and DynamoDB

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:4200
    Description: Frontend origin allowed to call the API through CORS
  CognitoDomainPrefix:
    Type: String
    Default: pagamentos-app-authenticator
    Description: Prefix for the Cognito Hosted UI domain
  FrontendUrl:
    Type: String
    Default: https://main.d3at3wpexagb3r.amplifyapp.com
    Description: Angular application URL

Globals:
  Function:
    Runtime: java25
    Timeout: 10
    MemorySize: 1024
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ""

Resources:
  # AWS ApiGateway HTTP API
  PagamentosHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      # Here we define how the logs should look like and where they should be saved for AWS ApiGateway in Cloudwatch
      AccessLogSettings: 
        DestinationArn: !GetAtt PagamentosApiAccessLogs.Arn
        Format: '{"requestId": "$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage","authorizerErro":"$context.authorizer.error","authorizerPrincipalId":"$context.authorizer.principalId","jwtSubject":"$context.authorizer.claims.sub","requestTimeEpoch":"$contect.requestTimeEpoch","responseLatency":"$context.responseLatency","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","jwtUsername":"$context.authorizer.claims.username","userAgent":"$context.identity.userAgent"}'

      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub '${AWS::StackName}-pagamentos-api'
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - http://127.0.0.1:4200
          - http://localhost:4200
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: false
        MaxAge: 300
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${PagamentosUserPool}"
              audience:
                - !Ref PagamentosUserPoolClient
            IdentitySource: "$request.header.Authorization"

  # AWS DyanmoDB Table (Pagamento Table)
  PagamentosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-pagamentos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # AWS Cognito (Pagamentos User Pool)
  PagamentosUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
          
  # AWS Cognito App Client
  PagamentosUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: pagamentos-app-client
      UserPoolId: !Ref PagamentosUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref FrontendUrl
        - http://localhost:4200
      LogoutURLs:
        - !Ref FrontendUrl
        - http://localhost:4200
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10

  # AWS Cognito Hosted UI Domain
  PagamentosUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref PagamentosUserPool
      ManagedLoginVersion: 2

  PagamentosManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref PagamentosUserPool
      ClientId: !Ref PagamentosUserPoolClient
      UseCognitoProvidedValues: true

  # AWS Lambda (ReadPagamento Function)
  ReadPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.ReadPagamentosHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PagamentosTable
      Events:
        ListPagamentos:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos
            Method: GET
        GetPagamento:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: GET
        ListPagamentosByStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/status/{status}
            Method: GET

  # AWS Lambda (CreatePagamento Function)
  CreatePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.CreatePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref PagamentosTable
      Events:
        CreatePagamento:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos
            Method: POST

  # AWS Lambda (PagarPagamento Function)
  PagarPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.PagarPagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Events:
        PagarPagamentos:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/pagar
            Method: POST

  # AWS Lambda (DeletePagamento Function)
  DeletePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.DeletePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Events:
        DeletePagamentoById:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: DELETE
        DeletePagamentoByProcessNum:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/process/{processNum}
            Method: DELETE

  # AWS CloudWatch - API Gateway Access Logs
  PagamentosApiAccessLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-pagamentos-http-api-access"
      RetentionInDays: 7  
  
Outputs:
  PagamentosApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${PagamentosHttpApi}.execute-api.${AWS::Region}.amazonaws.com/pagamentos"
    
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref PagamentosUserPool

  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref PagamentosUserPoolClient

  CognitoHostedUiDomain:
    Description: Cognito Hosted UI Domain
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  
  CognitoRegion:
    Description: AWS Region for Cognito
    Value: !Ref AWS::Region