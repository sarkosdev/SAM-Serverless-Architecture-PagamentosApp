AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Pagamentos API with API Gateway, Lambda and DynamoDB

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:4200
    Description: Frontend origin allowed to call the API through CORS

Globals:
  Function:
    Runtime: java25
    Timeout: 10
    MemorySize: 1024
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ""

Resources:
  # AWS ApiGateway HTTP API
  PagamentosHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub '${AWS::StackName}-pagamentos-api'
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - http://127.0.0.1:4200
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: false
        MaxAge: 300

  # AWS DyanmoDB Table (Pagamento Table)
  PagamentosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-pagamentos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # AWS Lambda (ReadPagamento Function)
  ReadPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.ReadPagamentosHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PagamentosTable
      Events:
        ListPagamentos:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos
            Method: GET
        GetPagamento:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: GET
        ListPagamentosByStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/status/{status}
            Method: GET

  # AWS Lambda (CreatePagamento Function)
  CreatePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.CreatePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref PagamentosTable
      Events:
        CreatePagamento:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos
            Method: POST

  # AWS Lambda (PagarPagamento Function)
  PagarPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.PagarPagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Events:
        PagarPagamentos:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/pagar
            Method: POST

  # AWS Lambda (DeletePagamento Function)
  DeletePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.DeletePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Events:
        DeletePagamentoById:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: DELETE
        DeletePagamentoByProcessNum:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/process/{processNum}
            Method: DELETE

Outputs:
  PagamentosApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${PagamentosHttpApi}.execute-api.${AWS::Region}.amazonaws.com/pagamentos"