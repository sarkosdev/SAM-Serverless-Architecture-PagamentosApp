AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Pagamentos API with API Gateway, Lambda and DynamoDB

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:4200
    Description: Frontend origin allowed to call the API through CORS
  CognitoDomainPrefix:
    Type: String
    Default: pagamentos-app-authenticator
    Description: Prefix for the Cognito Hosted UI domain
  FrontendUrl:
    Type: String
    Default: https://main.d3at3wpexagb3r.amplifyapp.com
    Description: Angular application URL
  AlarmNotificationEmail:
    Type: String
    Description: Email address that receives CloudWatch alarm notifications
  LayerArtifactBucket:
    Type: String
  PdfBoxLayerS3Key:
    Type: String

Globals:
  Function:
    Runtime: java25
    Timeout: 10
    MemorySize: 1024
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ''
        S3_ENDPOINT: ''
        APP_ENV: cloud
        LOCAL_USERNAME: ''

Resources:
  # AWS ApiGateway HTTP API
  PagamentosHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Here we define how the logs should look like and where they should be saved for AWS ApiGateway in Cloudwatch
      AccessLogSettings:
        DestinationArn: !GetAtt PagamentosApiAccessLogs.Arn
        Format: '{"requestId":
          "$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error","authorizerPrincipalId":"$context.authorizer.principalId","jwtSubject":"$context.authorizer.claims.sub","requestTimeEpoch":"$context.requestTimeEpoch","responseLatency":"$context.responseLatency","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","jwtUsername":"$context.authorizer.claims.username","userAgent":"$context.identity.userAgent"}'

      DefinitionBody:
        openapi: 3.0.1
        info:
          title: !Sub ${AWS::StackName}-pagamentos-api
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - http://127.0.0.1:4200
          - http://localhost:4200
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: false
        MaxAge: 300
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${PagamentosUserPool}
              audience:
                - !Ref PagamentosUserPoolClient
            IdentitySource: $request.header.Authorization

  # AWS DyanmoDB Table (Pagamento Table)
  PagamentosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-pagamentos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # AWS Cognito (Pagamentos User Pool)
  PagamentosUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

  # AWS Cognito App Client
  PagamentosUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: pagamentos-app-client
      UserPoolId: !Ref PagamentosUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref FrontendUrl
        - http://localhost:4200
      LogoutURLs:
        - !Ref FrontendUrl
        - http://localhost:4200
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10

  # AWS Cognito Hosted UI Domain
  PagamentosUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref PagamentosUserPool
      ManagedLoginVersion: 2

  PagamentosManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref PagamentosUserPool
      ClientId: !Ref PagamentosUserPoolClient
      UseCognitoProvidedValues: true

  PdfBoxLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-pdfbox
      Description: PDFBox dependencies used to generate payment PDFs
      CompatibleRuntimes:
        - java25
      CompatibleArchitectures:
        - arm64
      Content:
        S3Bucket: !Ref LayerArtifactBucket
        S3Key: !Ref PdfBoxLayerS3Key


  # AWS Lambda (ReadPagamento Function)
  ReadPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.ReadPagamentosHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PagamentosTable
      Events:
        ListPagamentos:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos
            Method: GET
        GetPagamento:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: GET
        ListPagamentosByStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/status/{status}
            Method: GET
      LoggingConfig:
        LogGroup: !Ref PagamentosLambdaLogs
        LogFormat: Text

  # AWS Lambda (CreatePagamento Function)
  CreatePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.CreatePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref PagamentosTable
      Events:
        CreatePagamento:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos
            Method: POST
      LoggingConfig:
        LogGroup: !Ref PagamentosLambdaLogs
        LogFormat: Text

  # AWS Lambda (PagarPagamento Function)
  PagarPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.PagarPagamentoHandler::handleRequest
      Layers: 
        - !Ref PdfBoxLayer
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
          BUCKET_NAME: !Ref PagamentosRegistoPdfBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
        - S3WritePolicy:
            BucketName: !Ref PagamentosRegistoPdfBucket
      Events:
        PagarPagamentos:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/pagar
            Method: POST
      LoggingConfig:
        LogGroup: !Ref PagamentosLambdaLogs
        LogFormat: Text

  # AWS Lambda (DeletePagamento Function)
  DeletePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.DeletePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Events:
        DeletePagamentoById:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/{id}
            Method: DELETE
        DeletePagamentoByProcessNum:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/process/{processNum}
            Method: DELETE
      LoggingConfig:
        LogGroup: !Ref PagamentosLambdaLogs
        LogFormat: Text

  # AWS Lambda (Historico Function)
  HistoricoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: historico.handler.HistoricoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PagamentosTable
      Events:
        ListHistoricoByUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /historico
            Method: GET
      LoggingConfig:
        LogGroup: !Ref PagamentosLambdaLogs
        LogFormat: Text

  # AWS Lambda (Download PDF Function)
  DownloadPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.DownloadPdfHandler::handleRequest
      Environment:
        Variables:
          BUCKET_NAME: !Ref PagamentosRegistoPdfBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PagamentosRegistoPdfBucket
      Events:
        DownloadPdf:
          Type: HttpApi
          Properties:
            ApiId: !Ref PagamentosHttpApi
            Path: /pagamentos/comprovativo/pdf
            Method: GET
      LoggingConfig:
        LogGroup: !Ref PagamentosLambdaLogs
        LogFormat: Text

  # AWS CloudWatch - API Gateway Access Logs Groups
  PagamentosApiAccessLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-pagamentos-http-api-access
      RetentionInDays: 30

  # AWS Cloudwatch - Lambdas Logs Groups    
  PagamentosLambdaLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /pagamentos/${AWS::StackName}/lambda
      RetentionInDays: 30

  # AWS CloudWatch - Dashboard Config
  PagamentosCloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# Serverless Pagamentos App\\nAPI Gateway, Lambda and DynamoDB operational dashboard"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiId", "${PagamentosHttpApi}", { "stat": "Sum", "label": "Requests" } ],
                  [ ".", "4xx", ".", ".", { "stat": "Sum", "label": "4XX errors" } ],
                  [ ".", "5xx", ".", ".", { "stat": "Sum", "label": "5XX errors" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Gateway requests and errors",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 2,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "Latency", "ApiId", "${PagamentosHttpApi}", { "stat": "Average", "label": "Average latency" } ],
                  [ ".", ".", ".", ".", { "stat": "p95", "label": "p95 latency" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Gateway latency",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ReadPagamentosFunction}", { "stat": "Sum", "label": "Read" } ],
                  [ ".", ".", ".", "${CreatePagamentoFunction}", { "stat": "Sum", "label": "Create" } ],
                  [ ".", ".", ".", "${PagarPagamentosFunction}", { "stat": "Sum", "label": "Pagar" } ],
                  [ ".", ".", ".", "${DeletePagamentoFunction}", { "stat": "Sum", "label": "Delete" } ],
                  [ ".", ".", ".", "${HistoricoFunction}",  {"stat": "Sum", "label": "Historico" } ],
                  [ ".", ".", ".", "${DownloadPdfFunction}", {"stat": "Sum", "label": "Download PDF" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda invocations",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ReadPagamentosFunction}", { "stat": "Sum", "label": "Read errors" } ],
                  [ ".", ".", ".", "${CreatePagamentoFunction}", { "stat": "Sum", "label": "Create errors" } ],
                  [ ".", ".", ".", "${PagarPagamentosFunction}", { "stat": "Sum", "label": "Pagar errors" } ],
                  [ ".", ".", ".", "${DeletePagamentoFunction}", { "stat": "Sum", "label": "Delete errors" } ],
                  [ ".", ".", ".", "${HistoricoFunction}",  {"stat": "Sum", "label": "Historico errors" } ],
                  [ ".", ".", ".", "${DownloadPdfFunction}", {"stat": "Sum", "label": "Download PDF errors" } ],

                  [ ".", "Throttles", ".", "${ReadPagamentosFunction}", { "stat": "Sum", "label": "Read throttles" } ],
                  [ ".", ".", ".", "${CreatePagamentoFunction}", { "stat": "Sum", "label": "Create throttles" } ],
                  [ ".", ".", ".", "${PagarPagamentosFunction}", { "stat": "Sum", "label": "Pagar throttles" } ],
                  [ ".", ".", ".", "${DeletePagamentoFunction}", { "stat": "Sum", "label": "Delete throttles" } ],
                  [ ".", ".", ".", "${HistoricoFunction}",  {"stat": "Sum", "label": "Historico throttles" } ],
                  [ ".", ".", ".", "${DownloadPdfFunction}",{"stat": "Sum", "label": "Download PDF throttles" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda errors and throttles",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ReadPagamentosFunction}", { "stat": "Average", "label": "Read avg" } ],
                  [ ".", ".", ".", "${CreatePagamentoFunction}", { "stat": "Average", "label": "Create avg" } ],
                  [ ".", ".", ".", "${PagarPagamentosFunction}", { "stat": "Average", "label": "Pagar avg" } ],
                  [ ".", ".", ".", "${DeletePagamentoFunction}", { "stat": "Average", "label": "Delete avg" } ],
                  [ ".", ".", ".", "${HistoricoFunction}",  {"stat": "Average", "label": "Historico avg" } ],
                  [ ".", ".", ".", "${DownloadPdfFunction}", {"stat": "Average", "label": "Download PDF avg" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda average duration",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${PagamentosTable}", { "stat": "Sum", "label": "Read capacity" } ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", ".", { "stat": "Sum", "label": "Write capacity" } ],
                  [ ".", "ThrottledRequests", ".", ".", { "stat": "Sum", "label": "Throttled requests" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "DynamoDB capacity and throttles",
                "period": 300
              }
            }
          ]
        }

  # AWS SNS - Alarm Topic
  PagamentosAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmNotificationEmail

  # API Gateway 500 errors Alarms
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-gateway-5xx
      AlarmDescription: API Gateway returned 5XX errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref PagamentosHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PagamentosAlarmTopic

  # API Gateway High Latency Alarm
  ApiGatewayHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-gateway-high-latency
      AlarmDescription: API Gateway average latency is high
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref PagamentosHttpApi
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PagamentosAlarmTopic

  # Lambda Functions Throttle Alarm
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-lambda-throttles
      AlarmDescription: One or more Lambda functions were throttled
      Metrics:
        - Id: readThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ReadPagamentosFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: createThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CreatePagamentoFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: pagarThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref PagarPagamentosFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: deleteThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DeletePagamentoFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: historicoThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref HistoricoFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: downloadPdfThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DownloadPdfFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: totalThrottles
          Expression: readThrottles + createThrottles + pagarThrottles + deleteThrottles +
            historicoThrottles + historicoThrottles
          Label: Total Lambda throttles
          ReturnData: true
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PagamentosAlarmTopic

  # DynamoDB Throttle Alarm
  DynamoDbThrottledRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dynamodb-throttled-requests
      AlarmDescription: DynamoDB table has throttled requests
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref PagamentosTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PagamentosAlarmTopic

  # S3 PDF Bucket Resource
  PagamentosRegistoPdfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-pagamento-registo-pdf
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  PagamentosApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${PagamentosHttpApi}.execute-api.${AWS::Region}.amazonaws.com/pagamentos

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref PagamentosUserPool

  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref PagamentosUserPoolClient

  CognitoHostedUiDomain:
    Description: Cognito Hosted UI Domain
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com

  CognitoRegion:
    Description: AWS Region for Cognito
    Value: !Ref AWS::Region

  CloudWatchDashboardName:
    Description: CloudWatch Dashboard name
    Value: !Ref PagamentosCloudWatchDashboard

  AlarmTopicArn:
    Description: SNS Topic ARN for CloudWatch alarms
    Value: !Ref PagamentosAlarmTopic