AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Pagamentos API with API Gateway, Lambda and DynamoDB

Globals:
  Function:
    Runtime: java25
    Timeout: 10
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ""

Resources:
  PagamentosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-pagamentos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ReadPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.ReadPagamentosHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PagamentosTable
      Events:
        ListPagamentos:
          Type: HttpApi
          Properties:
            Path: /pagamentos
            Method: GET
        GetPagamento:
          Type: HttpApi
          Properties:
            Path: /pagamentos/{id}
            Method: GET
        ListPagamentosByStatus:
          Type: HttpApi
          Properties:
            Path: /pagamentos/status/{status}
            Method: GET

  CreatePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.CreatePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref PagamentosTable
      Events:
        CreatePagamento:
          Type: HttpApi
          Properties:
            Path: /pagamentos
            Method: POST

  PagarPagamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.PagarPagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Events:
        PagarPagamentos:
          Type: HttpApi
          Properties:
            Path: /pagamentos/pagar
            Method: POST

  DeletePagamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PagamentosFunction
      Handler: pagamentos.handler.DeletePagamentoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref PagamentosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Events:
        DeletePagamentoById:
          Type: HttpApi
          Properties:
            Path: /pagamentos/{id}
            Method: DELETE
        DeletePagamentoByProcessNum:
          Type: HttpApi
          Properties:
            Path: /pagamentos/process/{processNum}
            Method: DELETE

Outputs:
  PagamentosApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/pagamentos"